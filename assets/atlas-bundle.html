<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project execution atlas</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101517;color:#eff4ef;font:14px system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column}nav{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid #35423f}button,select{font:inherit;background:#1a2528;color:#eff4ef;border:1px solid #465b60;border-radius:8px;padding:10px}button{cursor:pointer;color:#c6f27c}select{max-width:560px;min-width:0;flex:1}button:focus-visible,select:focus-visible{outline:3px solid #c6f27c;outline-offset:2px}#status{margin-left:auto;color:#a9bcbc;font-size:12px}iframe{display:block;width:100%;flex:1;min-height:0;border:0;background:#101517}@media(max-width:650px){nav{padding:10px;gap:8px;flex-wrap:wrap}label{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}#status{width:100%;margin:0}}
</style>
</head>
<body>
<nav aria-label="Atlas navigation"><button id="overview">Overview</button><label for="walkthrough">Walkthrough</label><select id="walkthrough"></select><span id="status" role="status"></span></nav>
<iframe id="viewer" title="Interactive project walkthrough"></iframe>
<script id="bundle" type="application/json">__BUNDLE__</script>
<script>
const bundle=JSON.parse(document.getElementById('bundle').textContent);
const viewer=document.getElementById('viewer'),select=document.getElementById('walkthrough');
document.title=bundle.title+' | Complete atlas';
for(const item of bundle.items){const option=document.createElement('option');option.value=item.id;option.textContent=item.title;select.append(option);}
let current='';
function show(id){
  if(!Object.hasOwn(bundle.pages,id))id='index';
  if(current===id)return;
  current=id;select.value=id;
  viewer.title=select.selectedOptions[0].textContent;
  viewer.srcdoc=bundle.pages[id];
  document.getElementById('status').textContent=bundle.count+' scenarios · One file · Offline';
}
function navigate(id){if(location.hash.slice(1)!==id)location.hash=id;else show(id);}
viewer.addEventListener('load',()=>{
  viewer.contentDocument.addEventListener('click',event=>{
    const link=event.target.closest('a[href]');if(!link)return;
    const href=link.getAttribute('href');
    if(href.endsWith('.html')&&Object.hasOwn(bundle.pages,href.slice(0,-5))){event.preventDefault();navigate(href.slice(0,-5));}
  });
});
select.addEventListener('change',()=>navigate(select.value));
document.getElementById('overview').addEventListener('click',()=>navigate('index'));
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
</body>
</html>
